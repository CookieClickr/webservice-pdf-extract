openapi: '3.0.0'
info:
  title: Image Description Service API
  description: API for generating descriptions from images using Gemini AI
  version: '1.0'
servers:
  - url: /
paths:
  /describe_image:
    post:
      summary: Generate description for an image
      operationId: describeImage
      requestBody:
        description: Base64 encoded image data with filename
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - data
              properties:
                filename:
                  type: string
                  description: The filename of the image
                data:
                  type: string
                  description: Base64 encoded image data
                  format: base64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_desc:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        data:
                          type: string
                          description: Text description of the image
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
